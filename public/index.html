<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PK LASER OS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section id="loginView" class="card login-card">
      <div class="eyebrow">PK LASER</div>
      <h1>PK LASER OS</h1>
      <p class="muted">Hệ điều hành vận hành kỹ thuật, máy móc và dịch vụ.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required /></label>
        <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Đăng nhập</button>
        <p id="loginError" class="error" hidden></p>
      </form>
    </section>

    <section id="appView" hidden>
      <header class="topbar">
        <div><div class="eyebrow">PK LASER</div><h1>Operations Dashboard</h1></div>
        <div class="userbox"><span id="userName"></span><button id="logoutBtn" class="ghost">Đăng xuất</button></div>
      </header>
      <div class="grid">
        <article class="card metric"><span>Hệ thống</span><strong id="healthStatus">Đang kiểm tra…</strong></article>
        <article class="card metric"><span>Vai trò</span><strong id="userRole">—</strong></article>
        <article class="card"><h2>Production foundation</h2><p>Authentication, session, D1 schema và API health đã sẵn sàng. Machine, Ticket và KPI sẽ nối vào cùng lớp API này.</p></article>
      </div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
